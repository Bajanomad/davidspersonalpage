<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body { font-family:system-ui, sans-serif; }
  #rain { position:fixed; inset:0; z-index:0; opacity:0; transition:opacity 1.6s ease; }
  body.raining #rain { opacity:1; }
  #vignette { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 46%, rgba(0,0,0,.55) 100%); }

  #center { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3;
    opacity:0; cursor:pointer; }
  #masterRing { width:158px; height:158px; border-radius:50%;
    border:1px solid rgba(255,106,0,.85);
    box-shadow:0 0 26px rgba(255,106,0,.45), inset 0 0 26px rgba(255,106,0,.22);
    display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.5); }
  #masterRing img { width:102px; height:102px; }
  body.alive #masterRing { animation:breathe 5.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{ box-shadow:0 0 18px rgba(255,106,0,.32), inset 0 0 18px rgba(255,106,0,.16);} 50%{ box-shadow:0 0 40px rgba(255,106,0,.6), inset 0 0 34px rgba(255,106,0,.3);} }
  body.surge #masterRing { box-shadow:0 0 90px rgba(255,170,60,.95), inset 0 0 60px rgba(255,140,0,.55); }

  .door { position:fixed; z-index:4; width:66px; height:66px; margin:-33px 0 0 -33px;
    border-radius:50%; border:1px solid rgba(255,106,0,.75); cursor:pointer;
    background:rgba(0,0,0,.6);
    box-shadow:0 0 16px rgba(255,106,0,.35), inset 0 0 14px rgba(255,106,0,.14);
    display:flex; align-items:center; justify-content:center;
    opacity:0; will-change:transform,opacity; }
  .door img { width:43px; height:43px; pointer-events:none; }
  .door:active { box-shadow:0 0 30px rgba(255,106,0,.8), inset 0 0 20px rgba(255,106,0,.3); }

  body.flash #center, body.flash .door { filter:brightness(2.4) drop-shadow(0 0 22px rgba(255,150,40,.95)); }
  #center, .door { transition:filter .09s linear; }
</style>

document.getElementById("masterImg").src = MASTER_URI;

const DOOR_URLS = [
  "https://411matrix.vercel.app/arcade",                       /* crown  - games */
  "https://411matrix.vercel.app/clima",                        /* flag   - weather */
  "https://411matrix.vercel.app/noticias",                     /* house  - news */
  "https://www.facebook.com/profile.php?id=61595657647422", /* K - Section 13 */
  "https://411matrix.vercel.app/mercado",                      /* bowtie - market */
  "https://411matrix.vercel.app/mapa"                          /* bars   - map */
];
let aliveAt = 0;
document.getElementById("center").addEventListener("click", () => {
  if (introDone && performance.now() - aliveAt > 350) location.href = "https://411matrix.vercel.app/home.html";
});
const doorEls = DOOR_URLS.map((url, i) => {
  const el = document.createElement("div");
  el.className = "door";
  const img = document.createElement("img");
  img.src = DOOR_URIS[i]; img.alt = "";
  el.appendChild(img);
  el.setAttribute("role", "button");
  el.addEventListener("click", () => { if (introDone && performance.now() - aliveAt > 350) location.href = url; });
  document.body.appendChild(el);
  return el;
});

/* ================= GEOMETRY ================= */
const CX = () => window.innerWidth / 2;
const CY = () => window.innerHeight / 2;
function orbitR() {
  return Math.max(118, Math.min(Math.min(window.innerWidth, window.innerHeight) * 0.40, CY() - 92, window.innerHeight - CY() - 92));
}
let orbitAngle = 0;
function placeDoors() {
  const R = orbitR();
  doorEls.forEach((el, i) => {
    const a = orbitAngle + (i / doorEls.length) * Math.PI * 2 - Math.PI / 2;
    el.style.transform = "translate(" + (CX() + R * Math.cos(a)) + "px," + (CY() + R * Math.sin(a)) + "px)";
  });
}
doorEls.forEach(el => { el.style.left = "0px"; el.style.top = "0px"; el.style.transform = "translate(" + CX() + "px," + CY() + "px)"; });
window.addEventListener("resize", () => { if (introDone) placeDoors(); });

/* ================= RAIN ================= */
const canvas = document.getElementById("rain"), ctx = canvas.getContext("2d");
let W, H, cols = [], sprites = [], spritesReady = 0;
const CELL = 34;
RAIN_URIS.forEach(u => {
  const img = new Image();
  img.onload = () => { spritesReady++; };
  img.src = u;
  sprites.push(img);
});
function sizeRain() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.ceil(W / CELL);
  cols = [];
  for (let i = 0; i < n; i++) cols.push({ x: i * CELL + 5, y: Math.random() * -H, speed: 0.35 + Math.random() * 0.75 });
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
}
sizeRain();
window.addEventListener("resize", sizeRain);
let raining = false, lastRain = 0;
function rainLoop(t) {
  requestAnimationFrame(rainLoop);
  if (!raining || spritesReady < sprites.length || t - lastRain < 50) return;
  lastRain = t;
  ctx.fillStyle = "rgba(0,0,0,0.075)"; ctx.fillRect(0, 0, W, H);
  for (const col of cols) {
    col.y += col.speed * CELL * 0.42;
    if (col.y > H + CELL) { col.y = -CELL * (2 + Math.random() * 8); col.speed = 0.35 + Math.random() * 0.75; }
    const gi = (Math.random() * sprites.length) | 0;
    ctx.globalAlpha = 0.34;
    ctx.drawImage(sprites[gi], col.x, col.y, 25, 25);
    if (Math.random() < 0.5) { ctx.globalAlpha = 0.15; ctx.drawImage(sprites[(Math.random() * sprites.length) | 0], col.x, col.y - CELL, 25, 25); }
    ctx.globalAlpha = 1;
  }
}
requestAnimationFrame(rainLoop);

/* ================= THE CEREMONY ================= */
let introDone = false, orbiting = false, paused = false;
const centerEl = document.getElementById("center");
const T0 = performance.now();
function symbolFade(t) {
  const T = 2600, k = Math.min((t - T0 - 300) / T, 1);
  if (k <= 0) { requestAnimationFrame(symbolFade); return; }
  centerEl.style.opacity = (k * k).toFixed(3);
  const s = 0.965 + 0.035 * k;
  centerEl.style.transform = "translate(-50%,-50%) scale(" + s.toFixed(4) + ")";
  if (k < 1) requestAnimationFrame(symbolFade); else arrive();
}
function arrive() {
  document.body.classList.add("surge");
  setTimeout(() => document.body.classList.remove("surge"), 240);
  setTimeout(startRain, 200);
  setTimeout(doorCeremony, 1200);
}
function startRain() { raining = true; document.body.classList.add("raining"); }
function doorCeremony() {
  doorEls.forEach((el, i) => {
    setTimeout(() => {
      placeDoors();
      el.style.transition = "opacity 1.5s ease";
      el.style.opacity = "1";
      if (i === doorEls.length - 1) setTimeout(theFlash, 1650);
    }, i * 380);
  });
}
function theFlash() {
  const seq = [[160, 1], [200, 0], [160, 1], [240, 0]];
  let t = 0;
  seq.forEach(([d, on]) => { setTimeout(() => document.body.classList.toggle("flash", !!on), t); t += d; });
  setTimeout(() => { introDone = true; orbiting = true; aliveAt = performance.now(); document.body.classList.add("alive"); }, t + 60);
}
requestAnimationFrame(symbolFade);

window.addEventListener("pointerdown", () => {
  if (introDone) { paused = true; return; }
  if (performance.now() - T0 < 600) return;
  centerEl.style.opacity = "1"; centerEl.style.transform = "translate(-50%,-50%) scale(1)";
  startRain();
  doorEls.forEach(el => { el.style.transition = "none"; el.style.opacity = "1"; });
  placeDoors();
  document.body.classList.remove("flash", "surge");
  introDone = true; orbiting = true; aliveAt = performance.now(); document.body.classList.add("alive");
});
window.addEventListener("pointerup", () => setTimeout(() => paused = false, 2500));

let lastT = performance.now();
function orbitLoop(t) {
  requestAnimationFrame(orbitLoop);
  const dt = Math.min(t - lastT, 100); lastT = t;
  if (orbiting && !paused) { orbitAngle += (Math.PI * 2 / 105000) * dt; placeDoors(); }
}
requestAnimationFrame(orbitLoop);
</script>
